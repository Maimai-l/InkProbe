name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid-procursus

      - name: Generate project
        run: xcodegen generate

      # 不经过 xcpretty 等过滤器，保留完整的编译错误输出。
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project InkProbe.xcodeproj \
            -scheme InkProbe \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Fake-sign with ldid
        run: ldid -S build/Build/Products/Release-iphoneos/InkProbe.app/InkProbe

      - name: Package IPA
        run: |
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/InkProbe.app ipa/Payload/
          cd ipa
          zip -qry InkProbe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InkProbe.ipa
          path: ipa/InkProbe.ipa
          if-no-files-found: error
